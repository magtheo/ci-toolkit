name: roadmap-freshness

# Dogfood: runs the TESTED template script in place — no installed
# copy, no sync invariant. templates/roadmap-freshness.sh is the
# single implementation (unit-tested in tests/test_roadmap_freshness.py).
# Our roadmap lives at the repo root, hence the ROADMAP.md argument.

on:
  schedule:
    - cron: "37 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check roadmap freshness
        run: bash templates/roadmap-freshness.sh ROADMAP.md
